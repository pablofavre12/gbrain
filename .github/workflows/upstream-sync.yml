# Merge upstream into the fork's deployment branch; every result remains reviewable.
name: upstream-sync
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
concurrency:
  group: upstream-sync
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/garrytan/gbrain.git
      BASE_BRANCH: master
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Configure git and fetch upstream
        run: |
          git config user.name 'perennia-upstream-sync[bot]'
          git config user.email 'noreply@perennia-regen.dev'
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream master --no-tags
      - name: Check upstream distance
        id: ahead
        run: |
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
      - name: Attempt merge
        if: steps.ahead.outputs.behind != '0'
        id: merge
        run: |
          branch="codex/upstream-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          if git merge --no-edit upstream/master > merge.log 2>&1; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            if [ ! -s conflicts.txt ]; then
              cat merge.log
              exit 1
            fi
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            {
              echo '# Upstream sync needs a manual merge'
              echo
              echo "Target branch: $BASE_BRANCH"
              echo
              echo 'Conflicting files:'
              echo '```'
              cat conflicts.txt
              echo '```'
              echo
              echo 'Follow FORK.md, including the independent migration cursors.'
            } > conflict-report.md
            cat conflict-report.md >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
          fi
      - name: Save conflict evidence
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-conflict
          path: |
            conflict-report.md
            conflicts.txt
            merge.log
      - name: Open conflict issue when enabled
        if: steps.merge.outputs.conflict == 'true'
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')
          if [ "$enabled" != 'true' ]; then
            echo 'Issues are disabled; the conflict report is in this run summary and artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync conflict ${GITHUB_RUN_ID}" --body-file conflict-report.md; then
            echo 'Issue creation failed; the saved conflict report remains available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install dependencies
        if: steps.merge.outputs.conflict == 'false'
        id: install
        continue-on-error: true
        timeout-minutes: 8
        run: bun scripts/ci-bun-install.ts --frozen-lockfile
      - name: Typecheck and test
        if: steps.merge.outputs.conflict == 'false' && steps.install.outcome == 'success'
        id: verify
        continue-on-error: true
        timeout-minutes: 120
        run: |
          bun run typecheck
          bun run test
      - name: Push review branch and open draft PR
        if: steps.merge.outputs.conflict == 'false'
        env:
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          git push origin "$SYNC_BRANCH"
          {
            echo "Merge upstream/master into $BASE_BRANCH."
            echo
            echo "Dependency installation: $INSTALL_RESULT. Local sync-job verification: $VERIFY_RESULT."
            echo
            echo 'Review the fork contracts, independent migration cursors and deployment pins before promotion.'
          } > /tmp/upstream-sync-pr.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
            --head "$SYNC_BRANCH" --draft --title "Upstream sync ${GITHUB_RUN_ID}" \
            --body-file /tmp/upstream-sync-pr.md
